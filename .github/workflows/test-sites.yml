name: Test new sites access
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sites
        run: |
          echo "lalafo:"
          curl -s -o lf.html -w "HTTP:%{http_code} SIZE:%{size_download}\n" -A "Mozilla/5.0" "https://lalafo.az/baku/kvartiry/arenda-kvartir/2-bedrooms?price%5Bto%5D=550&currency=AZN&parameters%5B359%5D%5B0%5D=23282"
          grep -c "__NEXT_DATA__" lf.html || true
          echo "yeniemlak:"
          curl -s -o ye.html -w "HTTP:%{http_code} SIZE:%{size_download}\n" -A "Mozilla/5.0" "https://yeniemlak.az/elan/axtar?emlak=1&elan_nov=2&seher%5B%5D=7&metro%5B%5D=8&otaq=2&otaq2=2"
          grep -c 'href="/elan/' ye.html || true
