name: Test tap.az access
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Curl tap.az
        run: |
          curl -s -o out.html -w "HTTP:%{http_code} SIZE:%{size_download}\n" -A "Mozilla/5.0" "https://tap.az/elanlar/dasinmaz-emlak/menziller?categoryId=Z2lkOi8vdGFwL0NhdGVnb3J5LzYzNQ&q%5Bis_shop%5D=&q%5Bregion_id%5D=420&order=date_desc&q%5Bprice%5D%5B%5D=&q%5Bprice%5D%5B%5D=550&p%5B740%5D=3724&p%5B736%5D%5B%5D=2&p%5B736%5D%5B%5D=2"
          echo "---blocked check---"
          grep -c "Just a moment\|cf-browser-verification" out.html || true
          echo "---next_data check---"
          grep -c "__NEXT_DATA__" out.html || true
