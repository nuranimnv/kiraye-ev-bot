name: Check kiraye listings

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run check
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
        run: ./check-kiraye.ps1

      - name: Commit updated state
        run: |
          git config user.name "kiraye-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          if ! git diff --cached --quiet; then
            git commit -m "Update seen listings state"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Pushed successfully"
                exit 0
              fi
              echo "Push rejected, retrying ($i)..."
              git fetch origin main
              git rebase -X ours origin/main || { git rebase --abort; break; }
              sleep $((RANDOM % 5 + 1))
            done
          else
            echo "No state changes"
          fi
